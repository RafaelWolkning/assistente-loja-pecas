# Blueprint do Render para a API (backend).
# Crie um "Blueprint Instance" apontando para este repositório; o Render lê
# este arquivo e provisiona o Web Service automaticamente.
# Nenhuma chave fica no repositório: GEMINI_API_KEY e CORS_ORIGIN usam
# `sync: false` e são preenchidas no painel do Render.

services:
  - type: web
    name: bytepecas-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /saude
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: LOG_LEVEL
        value: info
      - key: APP_VERSION
        value: 1.0.0
      # Segredos/URLs definidos manualmente no painel do Render:
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
